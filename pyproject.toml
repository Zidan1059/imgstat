[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "imgstat"
version = "0.1.0"
description = "A small CLI for image statistics and ASCII intensity histograms."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Arif Hassan Zidan" }]
keywords = ["cli", "image", "statistics", "histogram"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: Multimedia :: Graphics",
]
dependencies = ["numpy>=1.21", "pillow>=9.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
imgstat = "imgstat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
